name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in package.json's packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        # CI builds the desktop shell but never runs it: its types are enough, not its binary.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the desync fuzz suite, the save round trip and the lint guardrail tests.
      - run: pnpm test
      - run: pnpm build
